name: Signed release (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Configure repository signing secrets first"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lawyerup.jks"
          chmod 600 "$RUNNER_TEMP/lawyerup.jks"
      - name: Validate and build signed APK and AAB
        env:
          LAWYERUP_KEYSTORE: ${{ runner.temp }}/lawyerup.jks
          LAWYERUP_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          LAWYERUP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LAWYERUP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          ./gradlew testDebugUnitTest lintRelease assembleRelease bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LawyerUp-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - if: always()
        run: rm -f "$RUNNER_TEMP/lawyerup.jks"
